name: Kinter
options:
  bundleIdPrefix: com.kinter
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
targets:
  Kinter:
    type: application
    platform: iOS
    sources:
      - path: ../HostApp
        excludes:
          - "App/Info.plist"
          - "App/MiniAppHost.entitlements"
          - "Runtime/Support/MiniAppHost-Bridging-Header.h"
          - "Shared"
      - path: ../HostApp/Shared
      - path: ../SDK
        buildPhase: resources
      - path: ../HostApp/Resources
        buildPhase: resources
    dependencies:
      - target: KinterActivityWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kinter.host
        INFOPLIST_FILE: HostApp/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: HostApp/Runtime/Support/MiniAppHost-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: HostApp/App/MiniAppHost.entitlements

  KinterActivityWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ../ActivityWidget
        excludes:
          - "Info.plist"
      - path: ../HostApp/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kinter.host.activitywidget
        INFOPLIST_FILE: ActivityWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.9"
