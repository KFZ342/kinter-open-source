name: Build Kinter Unsigned IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'release-*'

jobs:
  build-unsigned-ipa:
    name: Build IPA for distribution
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode toolchain
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Build unsigned IPA
        shell: bash
        run: |
          chmod +x Tools/build_unsigned_ipa.sh
          ./Tools/build_unsigned_ipa.sh Release

      - name: Upload IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kinter-unsigned-ipa
          path: build/Kinter-unsigned.ipa
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event_name == 'workflow_dispatch' && format('unsigned-{0}', github.run_number) || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && format('Kinter Unsigned Build {0}', github.run_number) || format('Kinter Unsigned {0}', github.ref_name) }}
          artifacts: build/Kinter-unsigned.ipa
          allowUpdates: true
          makeLatest: true
          generateReleaseNotes: true
