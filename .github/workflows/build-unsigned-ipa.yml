name: Build Kinter Unsigned IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'release-*'

jobs:
  build-unsigned-ipa:
    name: Build IPA for distribution
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode toolchain
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Show schemes
        run: xcodebuild -list -project Kinter.xcodeproj

      - name: Build unsigned IPA
        shell: bash
        run: |
          chmod +x Tools/build_unsigned_ipa.sh
          ./Tools/build_unsigned_ipa.sh Release

      - name: Upload IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kinter-unsigned-ipa
          path: build/Kinter-unsigned.ipa
          if-no-files-found: error

      - name: Publish build log on failure
        if: failure()
        shell: bash
        run: |
          LOG=build/xcodebuild.log
          mkdir -p ci-log
          if [ -f "$LOG" ]; then tail -n 4000 "$LOG" > ci-log/xcodebuild.log; else echo "log missing" > ci-log/xcodebuild.log; fi
          echo "run=${{ github.run_number }} commit=${{ github.sha }}" >> ci-log/xcodebuild.log
          git config user.name "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          git checkout -B ci-log
          git add -f ci-log/xcodebuild.log
          git commit -m "CI log for run ${{ github.run_number }}" || true
          git push -f origin ci-log

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event_name == 'workflow_dispatch' && format('unsigned-{0}', github.run_number) || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && format('Kinter Unsigned Build {0}', github.run_number) || format('Kinter Unsigned {0}', github.ref_name) }}
          artifacts: build/Kinter-unsigned.ipa
          allowUpdates: true
          makeLatest: true
          generateReleaseNotes: true
